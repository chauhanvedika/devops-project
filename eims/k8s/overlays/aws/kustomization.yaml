# AWS (k3s on one small EC2). Jenkins sets the tag per build:
#   kustomize edit set image eims-backend=<registry>/eims-backend:<sha>
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
images:
  - name: eims-backend
    newName: REPLACE_ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/eims-backend
    newTag: latest
  - name: eims-frontend
    newName: REPLACE_ACCOUNT_ID.dkr.ecr.ap-south-1.amazonaws.com/eims-frontend
    newTag: latest
