version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: eims-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-eimsuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_local_only}
      POSTGRES_DB: ${DB_NAME:-eims}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - data-tier
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-eimsuser} -d ${DB_NAME:-eims}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No ports exposed to host - only reachable by backend on the internal
    # network, mirroring a private subnet in AWS.

  backend:
    build: ./backend
    container_name: eims-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-eimsuser}
      DB_PASSWORD: ${DB_PASSWORD:-changeme_local_only}
      DB_NAME: ${DB_NAME:-eims}
      DB_SSL: "false"
      FRONTEND_ORIGIN: http://localhost:${FRONTEND_HOST_PORT:-3000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set in .env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - data-tier
      - app-tier
    ports:
      - "${BACKEND_HOST_PORT:-5000}:5000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:${BACKEND_HOST_PORT:-5000}/api
    container_name: eims-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app-tier
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:8080"

networks:
  data-tier:
    driver: bridge
  app-tier:
    driver: bridge

volumes:
  db_data:
