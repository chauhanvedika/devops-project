apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: eims
resources: [namespace.yaml, postgres.yaml, backend.yaml, frontend.yaml, ingress.yaml, networkpolicy.yaml]
configMapGenerator:
  - name: eims-config
    literals:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=eims
      - DB_SSL=false
      - PORT=5000
      - TRUST_PROXY_HOPS=2      # traefik -> nginx -> backend
      - FRONTEND_ORIGIN=none   # same-origin via nginx /api proxy: CORS disabled
      - SEED_DEMO=false
images:
  - name: eims-backend
    newName: eims-backend
    newTag: local
  - name: eims-frontend
    newName: eims-frontend
    newTag: local
