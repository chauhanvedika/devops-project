# Single public entry point. /api is proxied to the backend by the frontend's nginx,
# so the backend Service is never exposed outside the cluster.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eims
spec:
  ingressClassName: traefik   # bundled with k3s
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: eims-frontend, port: { number: 80 } }
