apiVersion: v1
kind: Service
metadata:
  name: eims-backend
spec:
  selector: { app: eims-backend }
  ports:
    - { port: 5000, targetPort: 5000 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eims-backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: eims-backend }
  template:
    metadata:
      labels: { app: eims-backend }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # Applies DB migrations (advisory-locked, idempotent) before the API starts.
        - name: migrate
          image: eims-backend
          command: ["node", "db/migrate.js"]
          envFrom:
            - configMapRef: { name: eims-config }
          env:
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: eims-secrets, key: db-user } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: eims-secrets, key: db-password } }
            - name: ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: eims-secrets, key: admin-password } }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
      containers:
        - name: backend
          image: eims-backend
          ports:
            - { name: http, containerPort: 5000 }
          envFrom:
            - configMapRef: { name: eims-config }
          env:
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: eims-secrets, key: db-user } }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: eims-secrets, key: db-password } }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: eims-secrets, key: jwt-secret } }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 300m, memory: 192Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
